[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splabs-gate"
dynamic = ["version"]
description = "A deterministic gate for the actions of AI agents: the rules are a table, one engine reads it, and every action passes or does not pass. With the SDK that puts the hosted gate in front of an agent."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Silicon Psyche Labs" }]
dependencies = ["cel-python>=0.5", "sqlglot>=30", "bashlex>=0.18", "packaging>=23"]
keywords = ["agents", "llm", "security", "policy", "tool-calling", "mcp"]

[project.urls]
Homepage = "https://splabs.io/products/gate"
Documentation = "https://splabs.io/manual/gate"
Changelog = "https://splabs.io/changelog"

[project.optional-dependencies]
dev = ["pytest>=7"]
langchain = ["langchain-core"]
openai-agents = ["openai-agents"]
crewai = ["crewai"]

[tool.hatch.version]
path = "gate_table/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gate_table", "splabs_gate"]

[tool.hatch.build.targets.sdist]
include = ["gate_table", "splabs_gate", "examples", "tests", "docs", "README.md", "LICENSE"]
